<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Grand Luxury Tree - Christmas Edition</title>

  <!--  FontAwesome ͼ??(ͼ) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />

  <!-- 벻ӽ??-->

  <style>
    /* ޸ıΪɫ??*/
    body {
      margin: 0;
      overflow: hidden;
      background: radial-gradient(circle at center, #0f2027 0%, #203a43 50%, #2c5364 100%);
      background-color: #050d1a;
      font-family: 'Times New Roman', serif;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }

    #canvas-container {
      width: 100vw;
      height: 100vh;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
      cursor: grab;
    }

    #canvas-container:active {
      cursor: grabbing;
    }

    /* UI Overlay */
    #ui-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 40px;
      box-sizing: border-box;
      transition: opacity 0.5s ease;
    }

    .ui-hidden {
      opacity: 0 !important;
      pointer-events: none !important;
    }

    /* Loading */
    #loader {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #050d1a;
      z-index: 100;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: opacity 0.8s ease-out;
    }

    .loader-text {
      color: #d4af37;
      font-size: 14px;
      letter-spacing: 4px;
      margin-top: 20px;
      text-transform: uppercase;
      font-weight: 100;
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 1px solid rgba(212, 175, 55, 0.2);
      border-top: 1px solid #d4af37;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      0% {
        transform: rotate(0deg);
      }

      100% {
        transform: rotate(360deg);
      }
    }

    /* Typography */
    h1 {
      color: #fceea7;
      font-size: min(8vw, 56px);
      margin: 0;
      font-weight: 400;
      letter-spacing: 6px;
      text-shadow: 0 0 50px rgba(252, 238, 167, 0.6);
      background: linear-gradient(to bottom, #fff, #eebb66);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      font-family: 'Cinzel', 'Times New Roman', serif;
      opacity: 0.9;
      transition: opacity 0.5s ease;
      text-align: center;
      pointer-events: none;
    }

    @media (min-width: 768px) {
      h1 {
        font-size: 56px;
      }
    }

    /* Controls */


    /* --- NEW UPLOAD UI STYLES --- */
    .round-btn {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(5px);
      color: #ccc;
      cursor: pointer;
      transition: all 0.3s;
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.5);
      pointer-events: auto;
    }

    .round-btn:hover {
      border-color: #FFD700;
      color: #FFD700;
      transform: scale(1.1);
      box-shadow: 0 0 20px rgba(255, 215, 0, 0.3);
    }

    .modal-hidden {
      display: none !important;
    }

    #upload-modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: transparent;
      /* No overlay background - same as Share Modal */
      backdrop-filter: none;
      /* No blur on overlay */
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: fadeIn 0.3s ease;
      pointer-events: auto;
    }

    .modal-content {
      background: rgba(20, 20, 20, 0.7);
      /* More transparent */
      border: 1px solid rgba(212, 175, 55, 0.3);
      border-radius: 20px;
      padding: 30px;
      width: 400px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
      display: flex;
      flex-direction: column;
      gap: 20px;
      pointer-events: auto;
      /* Enable interaction */
      backdrop-filter: blur(20px);
      /* Stronger blur */
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding-bottom: 15px;
    }

    .modal-header h2 {
      color: #FFD700;
      font-family: 'Cinzel', serif;
      font-size: 20px;
      margin: 0;
    }

    .close-btn {
      background: none;
      border: none;
      color: #666;
      cursor: pointer;
      font-size: 18px;
      pointer-events: auto;
      /* Enable interaction */
    }

    .close-btn:hover {
      color: #fff;
    }

    .modal-grid-container {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .modal-grid-item {
      aspect-ratio: 1;
      background: rgba(255, 255, 255, 0.05);
      border: 2px solid rgba(255, 255, 255, 0.1);
      /* Solid border like share cards */
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.3s;
      overflow: hidden;
      font-size: 24px;
      color: rgba(255, 255, 255, 0.1);
      pointer-events: auto;
      position: relative;
      /* For delete button positioning */
    }

    .modal-grid-item:hover {
      border-color: #FFD700;
      color: #FFD700;
      box-shadow: 0 0 20px rgba(255, 215, 0, 0.4);
      /* Glow effect */
    }

    .modal-grid-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .modal-grid-item.filled {
      border-color: rgba(212, 175, 55, 0.5);
    }

    /* Individual Delete Button */
    .grid-delete-btn {
      position: absolute;
      top: 4px;
      right: 4px;
      width: 24px;
      height: 24px;
      background: rgba(255, 0, 0, 0.8);
      border: none;
      border-radius: 50%;
      color: white;
      font-size: 12px;
      cursor: pointer;
      display: none;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
      z-index: 10;
    }

    .modal-grid-item.filled:hover .grid-delete-btn {
      display: flex;
    }

    .grid-delete-btn:hover {
      background: rgba(255, 0, 0, 1);
      transform: scale(1.1);
    }

    .modal-action-btn {
      display: block;
      width: 100%;
      padding: 12px;
      background: #FFD700;
      color: #000;
      text-align: center;
      border-radius: 10px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s;
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .modal-action-btn:hover {
      box-shadow: 0 0 25px rgba(255, 215, 0, 0.6);
      /* Glow instead of scale */
    }

    /* Share Modal Styles */
    .share-preview {
      margin-bottom: 20px;
      /* Restricting height as per user request to avoid 'too tall' look */
      max-height: 250px;
      display: flex;
      justify-content: center;
      align-items: center;
      background: rgba(0, 0, 0, 0.3);
      border-radius: 10px;
      overflow: hidden;
    }

    #share-screenshot {
      max-height: 250px;
      width: auto;
      max-width: 100%;
      object-fit: contain;
    }

    .share-options {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
      margin-bottom: 20px;
    }

    .share-option-card {
      background: rgba(255, 255, 255, 0.05);
      border: 2px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 20px;
      text-align: center;
      cursor: pointer;
      transition: all 0.3s;
      position: relative;
      pointer-events: auto;
    }

    .share-option-card:hover {
      border-color: #FFD700;
      background: rgba(255, 215, 0, 0.1);
      box-shadow: 0 0 25px rgba(255, 215, 0, 0.4);
      /* Glow instead of translateY */
    }

    .share-option-card.premium {
      border-color: rgba(212, 175, 55, 0.5);
    }

    .share-option-card.premium:hover {
      border-color: #FFD700;
      box-shadow: 0 0 20px rgba(255, 215, 0, 0.3);
    }

    .option-icon {
      font-size: 40px;
      margin-bottom: 10px;
    }

    .share-option-card h3 {
      color: #FFD700;
      font-family: 'Cinzel', serif;
      font-size: 16px;
      margin: 10px 0;
    }

    .share-option-card p {
      color: #ccc;
      font-size: 12px;
      margin: 5px 0;
    }

    .option-price {
      color: #FFD700;
      font-weight: bold;
      font-size: 18px;
      margin-top: 10px;
    }

    .premium-badge {
      position: absolute;
      top: -10px;
      right: -10px;
      background: linear-gradient(135deg, #FFD700, #FFA500);
      color: #000;
      padding: 4px 12px;
      border-radius: 12px;
      font-size: 10px;
      font-weight: bold;
      text-transform: uppercase;
    }

    /* Share Methods Styles */
    .share-methods {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 20px;
    }

    .share-method-item {
      background: rgba(255, 255, 255, 0.05);
      border: 2px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 15px 20px;
      display: flex;
      align-items: center;
      gap: 15px;
      cursor: pointer;
      transition: all 0.3s;
    }

    .share-method-item:hover {
      border-color: #FFD700;
      box-shadow: 0 0 20px rgba(255, 215, 0, 0.4);
    }

    .share-method-item i {
      font-size: 24px;
      color: #FFD700;
    }

    .share-method-item span {
      color: #fff;
      font-size: 14px;
    }

    /* Payment Styles */
    .payment-summary {
      background: rgba(255, 255, 255, 0.05);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
    }

    .summary-item {
      display: flex;
      justify-content: space-between;
      margin-bottom: 10px;
      color: #ccc;
    }

    .summary-item.total {
      color: #FFD700;
      font-weight: bold;
      font-size: 18px;
      margin-top: 10px;
    }

    .summary-divider {
      height: 1px;
      background: rgba(255, 255, 255, 0.1);
      margin: 10px 0;
    }

    .price {
      color: #FFD700;
      font-weight: bold;
    }

    .payment-methods h3 {
      color: #FFD700;
      font-family: 'Cinzel', serif;
      font-size: 14px;
      margin-bottom: 15px;
    }

    .payment-method-item {
      background: rgba(255, 255, 255, 0.05);
      border: 2px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 15px 20px;
      display: flex;
      align-items: center;
      gap: 15px;
      cursor: pointer;
      transition: all 0.3s;
      margin-bottom: 10px;
    }

    .payment-method-item:hover {
      border-color: #FFD700;
      box-shadow: 0 0 20px rgba(255, 215, 0, 0.4);
    }

    .payment-method-item i {
      font-size: 24px;
      color: #FFD700;
    }

    .payment-method-item span {
      color: #fff;
      font-size: 14px;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: scale(0.95);
      }

      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    .controls-wrapper {
      position: absolute;
      top: 100px;
      right: 20px;
      pointer-events: auto;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 10px;
      z-index: 20;
      transition: opacity 0.5s ease;
    }

    /* <!--
  - @Project: Grand Luxury Tree - Christmas Edition (Touch & Gesture & Stats)
  - @Author: wp/electronicminer
  - @Date: 2025-12-08
  - @Description: 3D Christmas tree with AI Gestures + Touch + Traffic Analytics.
  - @Style: Luxury Dashboard UI (Hidden by default, toggle with 'S')
--> */
    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
      align-items: flex-end;
    }

    .control-btn {
      background: rgba(20, 20, 20, 0.6);
      border: 1px solid rgba(212, 175, 55, 0.4);
      color: #d4af37;
      padding: 10px 20px;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 2px;
      font-size: 10px;
      transition: all 0.4s;
      display: flex;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(5px);
      min-width: 120px;
    }

    /* Enhanced Camera Preview Button - Override */
    #webcam-wrapper {
      position: fixed;
      top: 30px;
      /* Top-left position */
      left: 30px;
      width: 200px;
      height: 150px;
      background: rgba(8, 15, 25, 0.75);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(212, 175, 55, 0.25);
      border-radius: 12px;
      box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
      overflow: hidden;
      z-index: 99;
      display: none;
      /* Hidden by default */
      transition: all 0.3s ease;
    }

    #webcam-wrapper.active {
      display: block;
    }

    #webcam {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
      filter: blur(4px);
      /* Mirror flip for natural selfie view */
    }

    #hand-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      transform: scaleX(-1);
      /* Match video mirror flip */
      pointer-events: none;
      /* Allow clicks to pass through */
    }

    /* Camera Button Wrapper */
    #camera-wrapper {
      position: fixed;
      bottom: 30px;
      left: 30px;
      display: flex;
      align-items: center;
      gap: 15px;
      z-index: 100;
    }

    #camera-wrapper.breathing-wrapper {
      animation: breathingGlow 2s ease-in-out infinite;
    }

    #camera-wrapper .btn-label {
      color: #FFD700;
      font-size: 14px;
      font-weight: bold;
      white-space: nowrap;
      text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
    }

    #camera-wrapper.active .btn-label {
      display: none;
      /* Hide label when webcam is active */
    }

    @keyframes breathingGlow {

      0%,
      100% {
        filter: drop-shadow(0 0 20px rgba(255, 215, 0, 0.4));
      }

      50% {
        filter: drop-shadow(0 0 40px rgba(255, 215, 0, 0.8));
      }
    }

    #cam-btn:hover {
      border-color: #FFD700;
      box-shadow: 0 0 25px rgba(255, 215, 0, 0.6);
    }

    .control-btn.active {
      background: rgba(212, 175, 55, 0.8);
      color: #000;
      box-shadow: 0 0 15px rgba(212, 175, 55, 0.6);
    }

    .control-btn:hover {
      background: #d4af37;
      color: #000;
      box-shadow: 0 0 20px rgba(212, 175, 55, 0.5);
    }

    .hint-text {
      color: rgba(212, 175, 55, 0.5);
      font-size: 9px;
      letter-spacing: 1px;
      text-transform: uppercase;
      text-align: right;
      margin-top: 5px;
      max-width: 200px;
    }

    input[type="file"] {
      display: none;
    }

    /* Mode Buttons (Bottom) */
    #mode-bar {
      position: absolute;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 15px;
      z-index: 20;
      pointer-events: auto;
    }

    .mode-btn {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.6);
      border: 1px solid #d4af37;
      color: #d4af37;
      font-size: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.3s;
      backdrop-filter: blur(4px);
    }

    .mode-btn:active {
      transform: scale(0.9);
      background: #d4af37;
      color: #000;
    }



    #debug-info {
      position: absolute;
      bottom: 5px;
      left: 5px;
      color: rgba(212, 175, 55, 0.6);
      font-size: 10px;
      font-family: monospace;
      pointer-events: none;
      z-index: 51;
      width: 100%;
      text-align: center;
    }



    /* Audio Toggle Button */
    #audio-btn {
      position: absolute;
      bottom: 55px;
      /* Above camera button */
      left: 0;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: rgba(20, 20, 20, 0.6);
      border: 1px solid rgba(212, 175, 55, 0.4);
      color: #d4af37;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 16px;
      transition: all 0.3s;
      z-index: 101;
      backdrop-filter: blur(5px);
    }

    #audio-btn:hover {
      border-color: #FFD700;
      box-shadow: 0 0 15px rgba(255, 215, 0, 0.4);
      transform: scale(1.1);
    }

    #msg-box {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0, 0, 0, 0.9);
      border: 1px solid #d4af37;
      padding: 20px;
      color: #d4af37;
      z-index: 200;
      text-align: center;
      display: none;
      border-radius: 8px;
      min-width: 200px;
    }
